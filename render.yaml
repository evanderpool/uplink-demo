# Render deployment for the Uplink public demo.
#
# Free plan: the service sleeps when idle and wakes on the next visit
# (~30-60s). The documents ship with the repo (public SEC filings) and the
# index is built during deploy — no downloads, fast identical builds.
#
# Set in the Render dashboard (never in this repo):
#   ANTHROPIC_API_KEY  - powers the Ask AI brain (Claude Sonnet, ~2c/question)
#   OPENAI_API_KEY     - OPTIONAL. Add this to turn ON hybrid retrieval. With
#                        it set, the deploy embeds the corpus (sub-penny, one
#                        time) and answers use BM25 + semantic vectors. Without
#                        it, the build skips vectors and the demo runs pure
#                        BM25 — so the site works either way. Set a small spend
#                        cap on the OpenAI account too.

services:
  - type: web
    name: uplink-demo
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements-demo.txt &&
      python scripts/build_demo_index.py &&
      python scripts/build_vectors.py --db data/uplink.db
    startCommand: python -m uplink serve --db data/uplink.db --host 0.0.0.0 --port $PORT
    envVars:
      - key: UPLINK_DEMO
        value: "1"
      # The answering model, pinned here so the deploy's cost is explicit and
      # can't drift with a code default. Change it here, not in code.
      - key: UPLINK_BRAIN_MODEL
        value: "claude-sonnet-5"
      # Hybrid retrieval: on when an embedding key is present, otherwise the
      # retriever falls back to BM25 automatically. Safe to leave set.
      - key: UPLINK_HYBRID
        value: "1"
      - key: UPLINK_EMBEDDER
        value: "openai"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

# Render deployment for the Uplink public demo.
#
# Free plan: the service sleeps when idle and wakes on the next visit
# (~30-60s). The index is built during deploy from public sources, so the
# repo ships no documents and no database.
#
# Set in the Render dashboard (never in this repo):
#   ANTHROPIC_API_KEY  - powers the Ask AI brain (Claude Haiku)
#   UPLINK_CONTACT     - contact email for polite corpus fetching (SEC asks)

services:
  - type: web
    name: uplink-demo
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements-demo.txt &&
      python scripts/fetch_corpora.py &&
      python scripts/build_demo_index.py
    startCommand: python -m uplink serve --db data/uplink.db --host 0.0.0.0 --port $PORT
    envVars:
      - key: UPLINK_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPLINK_CONTACT
        sync: false

# Render deployment for the Uplink public demo.
#
# Free plan: the service sleeps when idle and wakes on the next visit
# (~30-60s). The documents ship with the repo (public SEC filings) and the
# index is built during deploy — no downloads, fast identical builds.
#
# Set in the Render dashboard (never in this repo):
#   ANTHROPIC_API_KEY  - powers the Ask AI brain (Claude Sonnet, ~2c/question)

services:
  - type: web
    name: uplink-demo
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements-demo.txt &&
      python scripts/build_demo_index.py
    startCommand: python -m uplink serve --db data/uplink.db --host 0.0.0.0 --port $PORT
    envVars:
      - key: UPLINK_DEMO
        value: "1"
      # The answering model, pinned here so the deploy's cost is explicit and
      # can't drift with a code default. Change it here, not in code.
      - key: UPLINK_BRAIN_MODEL
        value: "claude-sonnet-5"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
